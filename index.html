<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HidenCloud Bot Bypass Dashboard</title>
  
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>

  <style>
      /* Ẩn widget đi để giao diện sạch sẽ */
      .cf-turnstile { display: none !important; }
      
      *, *::before, *::after { box-sizing: border-box; }
      body { margin: 0; padding: 0; background-color: #0b0f19; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #cdd6f4; display: flex; flex-direction: column; min-height: 100vh; }
      header { background: linear-gradient(135deg, #1e1e2e 0%, #11111b 100%); padding: 20px 40px; border-bottom: 2px solid #89b4fa; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
      main { flex: 1; padding: 40px; max-width: 1400px; width: 100%; margin: 0 auto; }
      .panel { background-color: #1e1e2e; border: 1px solid #313244; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.3); overflow: hidden; }
      .panel-header { background-color: #181825; padding: 18px 24px; border-bottom: 1px solid #313244; display: flex; justify-content: space-between; align-items: center; }
      .panel-title { font-size: 16px; color: #89b4fa; font-weight: bold; }
      .log-container { max-height: 550px; overflow-y: auto; padding: 15px; background-color: #11111b; font-family: 'Courier New', Courier, monospace; font-size: 13px; line-height: 1.6; }
      .log-entry { padding: 6px 12px; border-left: 3px solid #89b4fa; margin-bottom: 4px; display: block; animation: fadeIn 0.3s ease-in-out; }
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
      .log-time { color: #6c7086; margin-right: 10px; font-weight: bold; }
      footer { text-align: center; padding: 20px; font-size: 12px; color: #585b70; margin-top: auto; }
  </style>
</head>
<body>

  <div class="cf-turnstile" data-sitekey="0x4AAAAAADVYv3Z49QR_Pnfp"></div>

  <div id="app-body">
      <header>
          <div><h1>LOG TỰ ĐỘNG CỦA SERVER</h1><p>Hệ thống giám sát Pentakill V5.2</p></div>
          <div id="status-badge" style="color: #a6e3a1; font-weight: bold;">Core Engine: CONNECTING</div>
      </header>

      <main>
          <div class="panel">
              <div class="panel-header">
                  <div class="panel-title">⚡ LIVE STREAM CONSOLE LOG SYSTEM</div>
              </div>
              <div class="log-container" id="log-box">
                  <div class="log-entry">Đang khởi tạo kết nối bảo mật...</div>
              </div>
          </div>
      </main>

      <footer>Developer Dashboard © 2026 • Bảo mật bởi Cloudflare Turnstile</footer>
  </div>

  <script>
      const BOT_API_URL = "http://noel.hidencloud.com:24606/get-logs";
      
      async function fetchLiveLogs() {
          const logBox = document.getElementById('log-box');
          const statusBadge = document.getElementById('status-badge');
          
          // Kiểm tra xem turnstile đã load chưa
          if (typeof turnstile === 'undefined') return;

          const token = turnstile.getResponse();
          
          if (!token) {
              statusBadge.innerText = "Core Engine: WAITING FOR TOKEN...";
              return;
          }

          try {
              const response = await fetch(BOT_API_URL, {
                  headers: { 'cf-turnstile-response': token }
              });
              
              if (!response.ok) throw new Error("Server từ chối");
              
              const data = await response.json();
              logBox.innerHTML = "";
              data.forEach(log => {
                  const entry = document.createElement('div');
                  entry.className = `log-entry`;
                  entry.innerHTML = `<span class="log-time">[${log.time}]</span> ${log.msg}`;
                  logBox.appendChild(entry);
              });
              logBox.scrollTop = logBox.scrollHeight;
              statusBadge.innerText = "Core Engine: CONNECTED";
          } catch (e) {
              statusBadge.innerText = "Core Engine: ERROR / ACCESS DENIED";
          }
      }

      // Đảm bảo lệnh 5s/lần chạy bất tử
      setInterval(fetchLiveLogs, 5000);
      
      // Gọi lần đầu sau 2s cho mượt
      setTimeout(fetchLiveLogs, 2000);
  </script>
</body>
</html>
