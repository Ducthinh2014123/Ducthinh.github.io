<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HidenCloud Bot Bypass Dashboard</title>
  
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>

  <style>
      /* Ẩn widget Turnstile đi cho giao diện sạch sẽ như ý bro kkk */
      .cf-turnstile { display: none !important; }
      
      *, *::before, *::after { box-sizing: border-box; }
      body { margin: 0; padding: 0; background-color: #0b0f19; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #cdd6f4; display: flex; flex-direction: column; min-height: 100vh; }
      header { background: linear-gradient(135deg, #1e1e2e 0%, #11111b 100%); padding: 20px 40px; border-bottom: 2px solid #89b4fa; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 20px rgba(0,0,0,0.5); position: relative; }
      .countdown-bar-container { position: absolute; bottom: -2px; left: 0; width: 100%; height: 2px; background-color: transparent; }
      #countdown-bar { width: 100%; height: 100%; background-color: #f5c2e7; box-shadow: 0 0 8px #f5c2e7; transition: width 0.1s linear; }
      .logo-area { display: flex; align-items: center; gap: 15px; }
      .logo-icon { width: 40px; height: 40px; background: #89b4fa; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #11111b; font-size: 20px; box-shadow: 0 0 15px rgba(137, 180, 250, 0.4); }
      .logo-text h1 { margin: 0; font-size: 22px; color: #f5c2e7; letter-spacing: 1px; }
      .logo-text p { margin: 0; font-size: 12px; color: #a6adc8; }
      .status-badge { background-color: rgba(166, 227, 161, 0.1); border: 1px solid #a6e3a1; color: #a6e3a1; padding: 6px 16px; border-radius: 20px; font-size: 13px; font-weight: bold; display: flex; align-items: center; gap: 8px; }
      .status-dot { width: 8px; height: 8px; background-color: #a6e3a1; border-radius: 50%; animation: blink 1.5s infinite; }
      @keyframes blink { 0% { opacity: 0.4; } 50% { opacity: 1; } 100% { opacity: 0.4; } }
      main { flex: 1; padding: 40px; max-width: 1400px; width: 100%; margin: 0 auto; }
      .panel { background-color: #1e1e2e; border: 1px solid #313244; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.3); overflow: hidden; }
      .panel-header { background-color: #181825; padding: 18px 24px; border-bottom: 1px solid #313244; display: flex; justify-content: space-between; align-items: center; }
      .panel-title { margin: 0; font-size: 16px; color: #89b4fa; font-weight: bold; display: flex; align-items: center; gap: 10px; }
      .panel-controls { display: flex; align-items: center; gap: 15px; }
      .btn-clear-manual { background: transparent; border: 1px solid #fab387; color: #fab387; padding: 4px 12px; font-size: 11px; font-weight: bold; border-radius: 6px; cursor: pointer; text-transform: uppercase; transition: all 0.2s ease; }
      .btn-clear-manual:hover:not(:disabled) { background-color: #fab387; color: #11111b; box-shadow: 0 0 10px rgba(250, 179, 135, 0.4); }
      .log-container { max-height: 550px; overflow-y: auto; padding: 15px; background-color: #11111b; font-family: 'Courier New', Courier, monospace; font-size: 13px; line-height: 1.6; scroll-behavior: smooth; }
      .log-entry { padding: 6px 12px; border-radius: 4px; margin-bottom: 4px; display: block; border-left: 3px solid transparent; animation: fadeIn 0.3s ease-in-out; }
      @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
      .log-time { color: #6c7086; margin-right: 10px; font-weight: bold; }
      .log-tag { padding: 2px 6px; border-radius: 3px; font-size: 11px; font-weight: bold; margin-right: 8px; text-transform: uppercase; }
      .log-info { border-left-color: #89b4fa; color: #cdd6f4; } .log-info .log-tag { background-color: rgba(137, 180, 250, 0.15); color: #89b4fa; }
      .log-success { border-left-color: #a6e3a1; color: #a6e3a1; } .log-success .log-tag { background-color: rgba(166, 227, 161, 0.15); color: #a6e3a1; }
      .log-warning { border-left-color: #fab387; color: #f9e2af; } .log-warning .log-tag { background-color: rgba(250, 179, 135, 0.15); color: #fab387; }
      .log-error { border-left-color: #f38ba8; color: #f38ba8; } .log-error .log-tag { background-color: rgba(243, 139, 168, 0.15); color: #f38ba8; }
      .log-bypass { border-left-color: #cba6f7; color: #f5c2e7; } .log-bypass .log-tag { background-color: rgba(203, 166, 247, 0.2); color: #cba6f7; }
      footer { text-align: center; padding: 20px; font-size: 12px; color: #585b70; border-top: 1px solid #181825; margin-top: auto; }
  </style>
</head>
<body>

  <div class="cf-turnstile" data-sitekey="0x4AAAAAADVYv3Z49QR_Pnfp"></div>

  <div id="app-body" style="display: flex; flex-direction: column; min-height: 100vh; width: 100%;">
      <header>
          <div class="logo-area">
              <div class="logo-icon">HC</div>
              <div class="logo-text"><h1>LOG TỰ ĐỘNG CỦA SERVER</h1><p>hệ thống giám sát log của server</p></div>
          </div>
          <div class="status-badge"><div class="status-dot" id="status-dot"></div><span id="status-text">Core Engine: CONNECTING</span></div>
          <div class="countdown-bar-container"><div id="countdown-bar"></div></div>
      </header>

      <main>
          <div class="panel">
              <div class="panel-header">
                  <div class="panel-title"><span>⚡</span> LIVE STREAM CONSOLE LOG SYSTEM</div>
                  <div class="panel-controls">
                      <div id="cycle-indicator" style="font-size: 12px; color: #a6adc8;">Tự động cập nhật: 5s/lần</div>
                      <button class="btn-clear-manual" onclick="forceClearAndReload()">Clear Log & Tải lại</button>
                  </div>
              </div>
              <div class="log-container" id="log-box">
                  <div class="log-entry log-info"><span class="log-time">[Hệ thống]</span> Đang kết nối bảo mật với Cloudflare...</div>
              </div>
          </div>
      </main>

      <footer>Developer Dashboard © 2026 • Chạy mượt mà trên Hosting github pages</footer>
  </div>

  <script>
      const BOT_API_URL = "http://noel.hidencloud.com:24606/get-logs";
      
      async function fetchLiveLogs() {
          const logBox = document.getElementById('log-box');
          
          // Kiểm tra xem turnstile đã sẵn sàng chưa
          if (typeof turnstile === 'undefined') return;

          // Hốt token từ Cloudflare Turnstile
          const token = turnstile.getResponse();
          
          if (!token) {
              console.log("Đang chờ xác thực Cloudflare...");
              return;
          }

          try {
              // Gửi token vào Header cho backend check var kkk
              const response = await fetch(BOT_API_URL, {
                  headers: { 'cf-turnstile-response': token }
              });
              
              if (!response.ok) throw new Error("Server từ chối kết nối");
              
              const data = await response.json();
              logBox.innerHTML = "";
              data.forEach(log => {
                  const logEntry = document.createElement('div');
                  logEntry.className = `log-entry log-${log.type}`;
                  logEntry.innerHTML = `<span class="log-time">[${log.time}]</span> <span class="log-tag">${log.tag}</span> ${log.msg}`;
                  logBox.appendChild(logEntry);
              });
              logBox.scrollTop = logBox.scrollHeight;
          } catch (e) {
              console.log("Lỗi hốt log, check Flask server đi bro!");
          }
      }

      // Vòng lặp hốt log 5s/lần
      setInterval(fetchLiveLogs, 5000);
      
      // Chờ 2s cho Turnstile ổn định rồi gọi lần đầu
      setTimeout(fetchLiveLogs, 2000);
  </script>
</body>
</html>
