name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]    # 🔥 ĐÃ GẮN LẠI NGÒI NỔ: Commit phát là tự động kích hoạt bốc đầu luôn!
  workflow_dispatch:    # Vẫn giữ bùa tàng hình chạy thủ công khi cần kkk

# NỆN LẠI QUẢ BÙA LỢI THEO LỆNH CHỦ TỊCH NHEM KKK!
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Pages Gác Cổng
        uses: actions/configure-pages@v5

      - name: Build and Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages Bất Tử
        id: deployment
        uses: actions/deploy-pages@v4
